name: simpsons-episode-map

services:
  simpsons:
    build: .
    container_name: simpsons-episode-map
    ports:
      - "5500:8000"
    volumes:
      - simpsons_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/persons', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  simpsons_data:
